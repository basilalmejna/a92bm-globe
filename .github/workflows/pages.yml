# Builds the site and refreshes the weather, space-weather, Gulf map and grey-line panels every hour (and about every 15 minutes via pushes from the PC).
# The QSO data (qsos.js, stats.svg) is pushed from Basil's PC by sync.py.
name: Publish site and weather

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install image libraries
        run: python3 -m pip install --quiet numpy pillow
      - name: Render panels
        run: sh tools/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
